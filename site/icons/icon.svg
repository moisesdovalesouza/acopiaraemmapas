<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Cartografia de Acopiara">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#1b2c3a"/>
      <stop offset="0.55" stop-color="#132330"/>
      <stop offset="1" stop-color="#0b151d"/>
    </linearGradient>
    <linearGradient id="pino" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#4fd8ae"/>
      <stop offset="1" stop-color="#17916f"/>
    </linearGradient>
    <filter id="sombra" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="corte"><rect width="512" height="512" rx="114" ry="114"/></clipPath>
  </defs>

  <rect width="512" height="512" rx="114" ry="114" fill="url(#fundo)"/>

  <g clip-path="url(#corte)">
    <!-- quadrícula UTM -->
    <g stroke="#ffffff" stroke-opacity="0.07" stroke-width="7">
      <path d="M170 0V512M342 0V512M0 170H512M0 342H512"/>
    </g>
    <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="4">
      <path d="M85 0V512M256 0V512M427 0V512M0 85H512M0 256H512M0 427H512"/>
    </g>

    <!-- eixo viário -->
    <path d="M-20 392 L200 330 L330 358 L540 296" fill="none" stroke="#8fa6b5" stroke-opacity="0.30"
          stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- edificações -->
    <g>
      <rect x="62"  y="356" width="74" height="60" rx="7" fill="#3f6f95" fill-opacity="0.95"/>
      <rect x="150" y="372" width="58" height="48" rx="7" fill="#7aa2c0" fill-opacity="0.92"/>
      <rect x="222" y="392" width="66" height="52" rx="7" fill="#c4d9e8" fill-opacity="0.90"/>
      <rect x="302" y="376" width="52" height="46" rx="7" fill="#5b89ad" fill-opacity="0.92"/>
      <rect x="368" y="344" width="80" height="62" rx="7" fill="#9dbdd4" fill-opacity="0.88"/>
      <rect x="96"  y="292" width="52" height="42" rx="7" fill="#2f5a7c" fill-opacity="0.75"/>
      <rect x="386" y="272" width="56" height="44" rx="7" fill="#2f5a7c" fill-opacity="0.70"/>
    </g>

    <!-- pino -->
    <g filter="url(#sombra)">
      <path d="M256 424
               C256 424 150 300 150 218
               a106 106 0 1 1 212 0
               c0 82 -106 206 -106 206Z"
            fill="url(#pino)"/>
      <circle cx="256" cy="212" r="43" fill="#0b151d" fill-opacity="0.92"/>
      <circle cx="256" cy="212" r="17" fill="#eafaf4"/>
    </g>
  </g>
</svg>
